name: Relay ChatGPT trade signals

on:
  pull_request:
    paths:
      - 'integrations/chatgpt_signals/**'
      - 'tests/test_chatgpt_signal_identity_gate.py'
      - '.github/workflows/chatgpt-signal-relay.yml'
  push:
    branches:
      - chatgpt-signal-inbox
    paths:
      - 'signals/inbox/*.json'

jobs:
  validate-paper-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test runner
        run: python -m pip install --upgrade pip pytest
      - name: Validate external-signal live admission is blocked
        run: python -m pytest tests/test_chatgpt_signal_identity_gate.py -q

  relay:
    if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt-signal-inbox'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout signal branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-signal-inbox
          fetch-depth: 2

      - name: Relay newly changed signals
        env:
          RELAY_URL: ${{ secrets.APEX_SIGNAL_RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.APEX_SIGNAL_RELAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELAY_URL"
          test -n "$RELAY_TOKEN"
          files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'signals/inbox/*.json' || true)
          for file in $files; do
            echo "Relaying $file"
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 5 --max-time 20 \
              -H 'Content-Type: application/json' \
              -H "X-APEX-Relay-Token: $RELAY_TOKEN" \
              --data "{\"signal\":$(cat "$file")}" \
              "$RELAY_URL/v1/signals"
            echo
          done
