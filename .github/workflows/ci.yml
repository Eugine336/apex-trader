name: APEX TRADER CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v -E '(MetaTrader5|^#|^$)' requirements.txt | pip install -r /dev/stdin
          pip install pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Check imports
        run: |
          python -c "from config import AppConfig; print('Config OK')"
          python -c "from adaptive import AdaptiveOptimizer; print('Adaptive OK')"
          python -c "from dashboard.state import LiveState; print('Dashboard OK')"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint check
        run: ruff check . --select E,F,W --ignore E501,E402,F401,E701,E731,E741 --exclude __pycache__,node_modules,.git
