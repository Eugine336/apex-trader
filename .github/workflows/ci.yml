name: APEX TRADER CI
# Keep the repository-wide identity and execution-boundary audit in the required CI path.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Ensure the repository's local packages (especially tick/) take precedence
    # over similarly named namespace packages installed by dependencies.
    env:
      PYTHONPATH: ${{ github.workspace }}
      # Do not let unrelated auto-loaded plugins shadow this repository's
      # top-level tick package. Load pytest-asyncio explicitly in each command.
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies (non-torch)
        run: |
          python -m pip install --upgrade pip
          # MetaTrader5 is Windows-only; torch is installed separately below.
          grep -v -E '(MetaTrader5|^torch|^#|^$)' requirements.txt | pip install -r /dev/stdin
          pip install pytest pytest-asyncio

      - name: Install torch (CPU build)
        run: |
          # The default Linux torch wheel pulls large CUDA packages that are slow
          # and fragile to install in CI; the CPU build is smaller and reliable,
          # and the RL subsystem only needs CPU torch under test. Isolated as its
          # own step so a torch install failure is attributable.
          pip install "torch>=2.0.0" \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple

      - name: Check for dependency conflicts
        run: pip check || echo "::warning::pip check reported dependency conflicts"

      - name: Diagnose project package resolution
        run: |
          python - <<'PY'
          import os
          import sys
          workspace = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          print("workspace:", workspace)
          print("tick package path exists:", os.path.isfile(os.path.join(workspace, "tick", "__init__.py")))
          sys.path.insert(0, workspace)
          import tick
          print("tick module file:", getattr(tick, "__file__", None))
          print("tick module path:", list(getattr(tick, "__path__", [])))
          PY

      - name: Verify test collection
        run: >-
          python -c "import tick, pytest;
          raise SystemExit(pytest.main(['-p','pytest_asyncio.plugin','tests/','--collect-only','-q']))"

      - name: Run required cognition regression suites
        run: >-
          python -c "import tick, pytest;
          raise SystemExit(pytest.main(['-p','pytest_asyncio.plugin',
          'tests/test_cognition_loop.py','tests/test_campaign.py',
          'tests/test_native_management.py','tests/test_identity_conformance.py',
          '-q']))"

      - name: Run tests
        run: >-
          python -c "import tick, pytest;
          raise SystemExit(pytest.main(['-p','pytest_asyncio.plugin','tests/','-v','--tb=short']))"

      - name: Audit canonical identity and safety boundaries
        if: always()
        run: python scripts/identity_audit.py

      - name: Check imports
        run: |
          python -c "from config import AppConfig; print('Config OK')"
          python -c "from adaptive import AdaptiveOptimizer; print('Adaptive OK')"
          python -c "from dashboard.state import LiveState; print('Dashboard OK')"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint check
        run: ruff check . --select E,F,W --ignore E501,E402,F401,E701,E731,E741 --exclude __pycache__,node_modules,.git
