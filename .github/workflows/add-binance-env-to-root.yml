name: Add Binance ChatGPT env settings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-env:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Append required settings to root .env
        shell: python
        run: |
          from pathlib import Path
          p = Path('.env')
          text = p.read_text(encoding='utf-8')
          keys = [
              'CHATGPT_RELAY_TOKEN', 'CHATGPT_RELAY_HOST', 'CHATGPT_RELAY_PORT',
              'BINANCE_EXECUTION_MODE', 'BINANCE_LIVE_EXECUTION_ENABLED',
              'BINANCE_API_KEY', 'BINANCE_API_SECRET', 'BINANCE_MAX_NOTIONAL_USDT',
              'BINANCE_FUTURES_BASE_URL', 'CHATGPT_SIGNAL_TIMEOUT_SECONDS',
              'CHATGPT_ALLOW_DUPLICATES', 'MAX_SIMULTANEOUS_POSITIONS',
              'MAX_ACCOUNT_RISK_PERCENT'
          ]
          existing = {line.split('=', 1)[0] for line in text.splitlines() if '=' in line and not line.lstrip().startswith('#')}
          block = '''

# ── ChatGPT Signal Relay ─────────────────────────────────────────────────────
CHATGPT_RELAY_TOKEN=
CHATGPT_RELAY_HOST=127.0.0.1
CHATGPT_RELAY_PORT=8790

# ── Binance Futures Execution ────────────────────────────────────────────────
BINANCE_EXECUTION_MODE=PAPER
BINANCE_LIVE_EXECUTION_ENABLED=false

# Only required when LIVE is explicitly enabled.
# Never commit real values here.
BINANCE_API_KEY=
BINANCE_API_SECRET=

# Hard notional ceiling per ChatGPT signal, in USDT.
BINANCE_MAX_NOTIONAL_USDT=100

# Default Binance USD-M Futures endpoint.
BINANCE_FUTURES_BASE_URL=https://fapi.binance.com

# ── Signal Safety ─────────────────────────────────────────────────────────────
CHATGPT_SIGNAL_TIMEOUT_SECONDS=90
CHATGPT_ALLOW_DUPLICATES=false
MAX_SIMULTANEOUS_POSITIONS=3
MAX_ACCOUNT_RISK_PERCENT=1.0
'''
          missing = [k for k in keys if k not in existing]
          if missing:
              p.write_text(text.rstrip() + block, encoding='utf-8')
              print('Added:', ', '.join(missing))
          else:
              print('All requested settings already exist; no change needed.')

      - name: Commit root env and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/add-binance-env-to-root.yml
          git add .env .github/workflows/add-binance-env-to-root.yml
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Configure root env for Binance ChatGPT execution'
          git push