name: Gold desk focused tests

on:
  pull_request:
    paths:
      - "gold_desk/**"
      - ".env.example"
      - ".gitignore"
      - "config.py"
      - "tests/test_env_template_security.py"
      - "tests/test_constitution_compliance_v2.py"
      - "tests/test_brain_ev_primary_gate.py"
      - "tests/test_env_local_classification.py"
      - "tests/test_hosted_provider_roster.py"
      - "tests/test_gold_desk_core.py"
      - "tests/test_action_executor.py"
      - "tests/test_brain_native_reasoning.py"
      - "tests/test_apex_identity_and_contextual_patterns.py"
      - "cognition/identity.py"
      - "cognition/strategy_knowledge.py"
      - "cognition/market_lenses.py"
      - "cognition/price_action_patterns.py"
      - "dashboard/state_brain.py"
      - "execution/lifecycle_loops.py"
      - "adaptive/param_evolution.py"
      - "infra/modal_vllm_deploy.py"
      - "llm/reasoning_orchestrator.py"
      - "scripts/recover_apex_db.py"
      - "tests/test_cognition_loop.py"
      - "tests/test_developing_analysis.py"
      - "cognition/market_lenses.py"
      - "cognition/pattern_rules.py"
      - "tests/test_persistence_recovery_history.py"
      - "persistence/recovery.py"
      - "persistence/domain_events.py"
      - "execution/action_executor.py"
      - "cognition/brain.py"
      - "cognition/contracts.py"
      - "cognition/contracts.py"
      - "event_driven_bootstrap.py"
      - "cognition/evidence_adapters.py"
      - "cognition/loop.py"
      - "GOLD_DESK_IMPLEMENTATION.md"
      - ".github/workflows/gold-desk.yml"
  push:
    branches:
      - "feature/gold-desk-core"
    paths:
      - "gold_desk/**"
      - ".env.example"
      - ".gitignore"
      - "config.py"
      - "tests/test_env_template_security.py"
      - "tests/test_constitution_compliance_v2.py"
      - "tests/test_brain_ev_primary_gate.py"
      - "tests/test_env_local_classification.py"
      - "tests/test_hosted_provider_roster.py"
      - "tests/test_gold_desk_core.py"
      - "tests/test_action_executor.py"
      - "tests/test_brain_native_reasoning.py"
      - "tests/test_apex_identity_and_contextual_patterns.py"
      - "tests/test_developing_analysis.py"
      - "cognition/identity.py"
      - "cognition/strategy_knowledge.py"
      - "cognition/market_lenses.py"
      - "cognition/price_action_patterns.py"
      - "dashboard/state_brain.py"
      - "execution/lifecycle_loops.py"
      - "adaptive/param_evolution.py"
      - "infra/modal_vllm_deploy.py"
      - "llm/reasoning_orchestrator.py"
      - "scripts/recover_apex_db.py"
      - "tests/test_cognition_loop.py"
      - "cognition/pattern_rules.py"
      - "execution/action_executor.py"
      - "cognition/brain.py"
      - "event_driven_bootstrap.py"
      - "cognition/evidence_adapters.py"
      - "cognition/loop.py"
      - "GOLD_DESK_IMPLEMENTATION.md"
      - ".github/workflows/gold-desk.yml"

jobs:
  gold-desk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test tools
        run: python -m pip install --upgrade pip pytest ruff loguru numpy pandas aiosqlite
      - name: Compile changed runtime modules
        run: >-
          python -m py_compile
          gold_desk/__init__.py gold_desk/apex_observer.py
          gold_desk/indicators.py gold_desk/models.py gold_desk/news_context.py
          gold_desk/strategies.py gold_desk/symbols.py
          cognition/brain.py cognition/brain_reasoning.py cognition/evidence_adapters.py
          cognition/contracts.py
          cognition/loop.py cognition/pattern_rules.py
          cognition/identity.py cognition/strategy_knowledge.py
          cognition/price_action_patterns.py cognition/market_lenses.py
          tests/test_apex_identity_and_contextual_patterns.py
          tests/test_developing_analysis.py tests/test_env_template_security.py
          tests/test_brain_ev_primary_gate.py
          config.py
          persistence/recovery.py persistence/domain_events.py
          execution/action_executor.py event_driven_bootstrap.py
      - name: Test deterministic Gold desk kernel
        # Includes universal market-lens freshness, native-hypothesis, and developing-loop contract regressions.
        run: >-
          python -c "import tick, pytest;
          raise SystemExit(pytest.main(['tests/test_gold_desk_core.py','tests/test_action_executor.py','tests/test_brain_native_reasoning.py','tests/test_persistence_recovery_history.py','tests/test_apex_identity_and_contextual_patterns.py','tests/test_developing_analysis.py','tests/test_env_template_security.py','tests/test_constitution_compliance_v2.py','tests/test_brain_ev_primary_gate.py','tests/test_cognition_loop.py','-q']))"
      - name: Lint new implementation
        run: ruff check gold_desk cognition/identity.py cognition/strategy_knowledge.py cognition/price_action_patterns.py cognition/market_lenses.py cognition/pattern_rules.py cognition/brain_reasoning.py cognition/brain.py cognition/contracts.py event_driven_bootstrap.py adaptive/param_evolution.py dashboard/state_brain.py execution/lifecycle_loops.py infra/modal_vllm_deploy.py llm/reasoning_orchestrator.py scripts/recover_apex_db.py tests/test_cognition_loop.py tests/test_apex_identity_and_contextual_patterns.py tests/test_developing_analysis.py tests/test_env_template_security.py tests/test_brain_ev_primary_gate.py tests/test_constitution_compliance_v2.py config.py --select E,F,W --ignore E501,E402,F401,E701,E731,E741
