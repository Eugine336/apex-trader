name: Sanitize tracked env

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sanitize tracked .env and add execution placeholders
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('.env')
          text = p.read_text(encoding='utf-8')

          replacements = {
              'MT5_LOGIN': 'your_mt5_login',
              'MT5_PASSWORD': 'your_mt5_password',
              'LLM_API_KEY': '',
              'GROQ_API_KEY': '',
              'HUGGINGFACE_API_KEY': '',
              'NVIDIA_API_KEY': '',
              'MODAL_INFERENCE_KEY': '',
              'COMPOSIO_API_KEY': '',
          }

          for key, value in replacements.items():
              text = re.sub(rf'(?m)^{re.escape(key)}=.*$', f'{key}={value}', text)

          section = '''\n\n# ── Binance Futures / ChatGPT execution ─────────────────────────────────────\n# Credentials are runtime-only. Never commit real values here.\nBINANCE_API_KEY=your_binance_api_key\nBINANCE_API_SECRET=your_binance_api_secret\nBINANCE_FUTURES_BASE_URL=https://fapi.binance.com\n\n# PAPER is the safe default. LIVE requires BOTH switches below.\nBINANCE_EXECUTION_MODE=PAPER\nBINANCE_LIVE_EXECUTION_ENABLED=false\nBINANCE_MAX_NOTIONAL_USDT=100\n\n# ChatGPT signal relay\nCHATGPT_RELAY_TOKEN=your_chatgpt_relay_token\nCHATGPT_RELAY_HOST=127.0.0.1\nCHATGPT_RELAY_PORT=8790\n'''

          if 'BINANCE_API_KEY=' not in text:
              text += section
          else:
              text = re.sub(r'(?m)^BINANCE_API_KEY=.*$', 'BINANCE_API_KEY=your_binance_api_key', text)
              text = re.sub(r'(?m)^BINANCE_API_SECRET=.*$', 'BINANCE_API_SECRET=your_binance_api_secret', text)
              text = re.sub(r'(?m)^BINANCE_EXECUTION_MODE=.*$', 'BINANCE_EXECUTION_MODE=PAPER', text)
              text = re.sub(r'(?m)^BINANCE_LIVE_EXECUTION_ENABLED=.*$', 'BINANCE_LIVE_EXECUTION_ENABLED=false', text)
              text = re.sub(r'(?m)^CHATGPT_RELAY_TOKEN=.*$', 'CHATGPT_RELAY_TOKEN=your_chatgpt_relay_token', text)

          p.write_text(text, encoding='utf-8')

      - name: Commit sanitized env and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/sanitize-env-and-add-binance.yml
          git add .env .github/workflows/sanitize-env-and-add-binance.yml
          git diff --cached --quiet || git commit -m "Sanitize env and add Binance relay placeholders"
          git push