[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
# E701/E731/E741 are stylistic (one-line blocks, lambda assignment, ambiguous
# single-char names) and pervasive in this codebase; baselined as ignored.
ignore = ["E501", "E402", "F401", "E701", "E731", "E741"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
